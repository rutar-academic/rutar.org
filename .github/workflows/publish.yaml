name: Build Zola Site

on:
  push:
  schedule:
    - cron: '30 10 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.23.3
      BIOME_VERSION: 2.5.9
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python (via uv)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Check formatting
        shell: bash
        run: |
          uvx ruff check scripts
          uvx ruff format scripts --check

      - name: Download papers and notes
        run: ./scripts/releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Generate data
        shell: bash
        run: |
          mkdir --parent data/generated
          ./scripts/pdf_data.py
          ./scripts/past_travel.py

      - name: Cache CV build
        uses: actions/cache@v6
        id: cache-cv
        env:
          cache-name: cache-cv
        with:
          path: static/alex_rutar_cv.pdf
          key: cache-cv-${{ hashFiles('data/papers.json', 'data/talks.json', 'data/cv.json', 'cv/*', 'scripts/cv.py') }}
      - if: ${{ steps.cache-cv.outputs.cache-hit != 'true' }}
        name: Generate CV .tex from template
        run: ./scripts/cv.py
      - if: ${{ steps.cache-cv.outputs.cache-hit != 'true' }}
        name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          work_in_root_file_dir: true
          root_file: "build/alex_rutar_cv.tex"
          post_compile: mv "build/alex_rutar_cv.pdf" "static/"

      - name: Install Zola
        shell: bash
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${archive}"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          install "${RUNNER_TEMP}/zola" "${RUNNER_TEMP}/bin/zola"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          test "$("${RUNNER_TEMP}/bin/zola" --version)" = "zola ${ZOLA_VERSION}"

      - name: Install Biome
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/bin/biome" \
            "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%40${BIOME_VERSION}/biome-linux-x64"
          chmod +x "${RUNNER_TEMP}/bin/biome"
          test "$("${RUNNER_TEMP}/bin/biome" --version)" = "Version: ${BIOME_VERSION}"

      - name: Build public HTML with drafts
        run: zola build --drafts
        if: github.ref != 'refs/heads/master'
      - name: Build public HTML
        run: zola build
        if: github.ref == 'refs/heads/master'

      - name: Check HTML and CSS
        shell: bash
        run: |
          uvx html5validator --root public/ --show-warnings
          biome lint public/*.css

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          command: pages deploy public "--project-name=rutar" "--branch=${{ github.ref_name }}"
          apiToken: ${{ secrets.CF_API_TOKEN }}
