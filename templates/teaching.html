{% extends "base.html" %}
{% block content %}
{{ section.content | safe }}
<ul>
{% for page in section.pages %}
    <li>
        <a href="{{ page.path | safe }}">{{ page.title }}</a>
        <div class="fade">{{ page.extra.where }}: {{ page.extra.when }}</div>
    </li>
{% endfor %}
</ul>
{% endblock %}
